<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Short Ski</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="fade" aria-hidden="true"></div>

    <div id="hud" class="hidden" inert>
      <div class="distance"><span id="dist">0</span><span class="unit">m</span></div>
      <div id="run-end" role="status" hidden><span>Finish</span><kbd>R</kbd></div>
    </div>

    <div id="title" aria-label="Choose your skier">
      <div id="lineup-labels" aria-label="Playable characters"></div>
    </div>

    <div id="pause" class="hidden" inert>
      <div class="pause-card">
        <h2>Paused</h2>
        <button data-choice="continue">Continue</button>
        <button data-choice="reset">Restart</button>
      </div>
    </div>

    <div id="loading">Loading</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
