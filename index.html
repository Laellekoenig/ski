<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Short Ski</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden" inert>
      <div class="distance"><span id="dist">0</span> m</div>
      <div id="run-end" role="status" hidden><strong>A little rest above the valley.</strong><span>Halfway down. Back up for another run?</span><span><kbd>R</kbd> back to the top</span></div>
    </div>

    <div id="title" aria-label="Choose your skier">
      <div id="lineup-labels" aria-label="Playable characters"></div>
      <div class="title-panel">
        <p id="character-announcement" aria-live="polite" aria-atomic="true"></p>
        <button id="start-button" type="button">Let’s ski, Beni! <kbd>Enter</kbd></button>
      </div>
    </div>

    <div id="pause" class="hidden" inert>
      <div class="pause-card">
        <h2>Paused</h2>
        <button data-choice="continue">Continue</button>
        <button data-choice="reset">Reset run</button>
        <p class="hint"><kbd>Esc</kbd> to keep skiing</p>
      </div>
    </div>

    <div id="loading">a little snow above the Engadine…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
